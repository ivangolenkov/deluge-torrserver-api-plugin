name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 / Python 3.11
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, test and install artifact in isolated profiles
        run: make ci-check
      - name: Separate core and Web UI filesystems
        run: make test-web-split
      - name: Test artifacts and logs (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stream-linux-x86_64
          path: |
            dist/*.egg
            build/ci/*.log
          if-no-files-found: error
          retention-days: 14
